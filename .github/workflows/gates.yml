name: gates

on:
  pull_request:
    branches: [main]
    # Labels are half of every exception, so applying one has to re-run the gates.
    # Without these, a label added after opening is invisible to the run that judged
    # the pull request, and the only way to re-evaluate is an empty commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  lane:
    name: lane
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: G2 lane
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node tools/gates/lane-check.mjs "${{ github.head_ref }}" "origin/${{ github.base_ref }}"

  envelope:
    name: envelope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: G3 envelope and evidence
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node tools/gates/envelope-check.mjs "${{ github.head_ref }}" "origin/${{ github.base_ref }}"

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The gates decide what merges, so they are tested before they are trusted.
      # The first run of this suite found a glob bug that had been approving
      # out-of-lane changes.
      - name: G4 gate engine tests
        run: node tools/gates/gates.test.mjs

      - name: G4 selfcheck
        run: node tools/gates/selfcheck.mjs

      - name: G4 gate list matches this workflow
        run: node tools/gates/spec-check.mjs

  cause:
    name: cause
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Constitution article 14. Without this the process grows from imagination,
      # and every addition is charged to every future task.
      #
      # The cause is read from the changelog diff, not the pull request body. Article 1:
      # a pull request body is not in the repository, so a cause recorded only there is
      # a cause nobody will find in three months. It also kept the body out of a shell
      # command, which is where it was being interpolated.
      - name: G7 framework changes cite an incident
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD")
          if echo "$CHANGED" | grep -qE '^docs/04-grokbot/skills/|^docs/03-gates/|^tools/gates/'; then
            if ! git diff -U0 "$BASE...HEAD" -- CHANGELOG.md | grep -q '^+.*★'; then
              echo "::error::This PR changes a gate or an SOP and adds no cause to CHANGELOG.md."
              echo "Add an entry marked ★: which real failure prompted this? Date, task id, or incident link."
              exit 1
            fi
          fi

  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [lane, envelope, docs, cause]
    if: always()
    steps:
      - name: Verdict
        run: |
          echo "lane=${{ needs.lane.result }} envelope=${{ needs.envelope.result }} docs=${{ needs.docs.result }} cause=${{ needs.cause.result }}"
          for r in "${{ needs.lane.result }}" "${{ needs.envelope.result }}" "${{ needs.docs.result }}" "${{ needs.cause.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Not every gate is green. Do not merge, and do not merge as an administrator either."
              exit 1
            fi
          done
          echo "All gates green."
